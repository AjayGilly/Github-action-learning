name: CICD

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "code checkout"
      
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Container
        run: echo "Docker container build"

  test:
    needs: [code, build]
    runs-on: ubuntu-latest
    steps:
      - name: test the container
        run: echo "testing the container"
          
  deploy:
    needs: [build,test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app
        run: echo "app deployed"
    
