name: CICD

on:
  workflow_dispatch:
   inputs:
     enviroment:
      description: This is the value where this workflow runs
      default: 'dev'
      required: true
      type: choice
      options:
       - dev
       - prod
       - staging

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        run: echo "code checkout"
      
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Container
        run: echo "Docker container build"

  test:
    needs: [code, build]
    runs-on: ubuntu-latest
    steps:
      - name: test the container
        run: echo "testing the container"
          
  deploy:
    needs: [code,build,test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app
        run: echo "app deployed"
    
